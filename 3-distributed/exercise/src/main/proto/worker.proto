syntax = "proto3";

package mapreduce;

option java_package = "mapreduce.pb";
option java_multiple_files = true;

// Pair and the job parameters are declared in infrastructure.proto. Reuse them.
// The Master service is declared there too; do not add it here.
import "infrastructure.proto";

// =============================================================== provided ==
//
// This file defines the RPCs and protobuf messages that let the Master and
// Workers communicate. Machines do not share memory, so requests and replies
// must carry every fact their receiver needs.
//
// infrastructure/Master.java sends Ping on PING_MS rather than TASK_MS.
// infrastructure/GrpcUserProgram.java creates Worker and Heartbeat with no
// constructor arguments. JobContext defines the facts the Master can send to a
// Worker.
//
// The Worker service below includes Fetch, which implements Shuffle & Sort.
// infrastructure/Shuffle.java implements its handler.

service Worker {

  // Fetch transfers one map task's group p to the Worker running reduce task p.
  // It is the only RPC between Workers.
  //
  // NO_SIDE_EFFECTS allows scenarios to retry Fetch.
  rpc Fetch (ShuffleRequest) returns (ShuffleReply) { option idempotency_level = NO_SIDE_EFFECTS; }

  // TODO(student): Add RunMapTask and RunReduceTask here. Their names and
  // request/reply message names appear in the student work section below.
}

// ShuffleRequest and ShuffleReply are used by infrastructure/Shuffle.java.
message ShuffleRequest {
  int32 task = 1;
  int32 partition = 2;
}

message ShuffleReply {
  string from = 1;
  repeated Pair pairs = 2;

  // False when this Worker does not hold the requested map task. A Worker can
  // reply successfully without holding the task.
  bool found = 3;
}


