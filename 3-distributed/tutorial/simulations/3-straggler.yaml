# The four-node system with three independent network and node events.
#
# The Java is unchanged. The simulation defines failures independently of the
# program, which lets the run show how the design responds.
#
#   kill       w1 stops permanently and leaves peersServing().
#   freeze     w2 stops answering for 600 refMs, then answers again. During
#              that interval, requests to w2 receive the same response as they
#              would from a dead node.
#   partition  the master and w3 lose reachability. w3 remains alive and
#              can answer other nodes. Reachability belongs to a *pair* of nodes.
#
# Each failure is written inside the node where it occurs. A `partition:` also
# names the other endpoint.
#
# When w1 dies at 300, its in-memory thumbnails are lost. Sending thumbnails
# back as they are made would reduce the loss. Compare the results to measure
# the cost.
#
# `retries:` can name Thumbnail because thumbs.proto marks it IDEMPOTENT. Remove
# that schema option and the file is refused before the run starts.
seed: 1

nodes:
  master:
    instance: m5.large
    zone: eu-central-1a
    runs: { dissaly.Job: src/thumbs/ThumbJob.java }

  w:
    count: 4
    prefix: w
    instance: c5.large
    zone: [eu-central-1a, eu-central-1a, eu-central-1b, eu-central-1b]
    runs: { Shrinker: src/thumbs/Shrinker.java }
    overrides:
      w1:
        failures:
          - { kill: true, at: 300 refMs }
      w2:
        failures:
          - { freeze: true, at: 500 refMs, for: 600 refMs }
      w3:
        failures:
          - { partition: master, at: 900 refMs }
          - { heal: master, at: 1600 refMs }

network:
  sameZone: 0.2 refMs
  crossZone: 0.8 refMs
  jitter: 0.1 refMs

retries:
  - { method: Thumbnail, attempts: 3, backoff: 40 refMs, multiplier: 2 }

input:
  unit:  image
  count: 40

simulatedDuration:
  src/thumbs/Shrinker.java:
    Thumbnail: { fixed: 0.4 refMs, perUnit: 55000 refNs }
    Collect:   { fixed: 1 refMs }
