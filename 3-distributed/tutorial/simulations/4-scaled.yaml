# Models 40 million images from smaller runs.
#
# A direct run would send 2.5 TB through four c5.large nodes. The engine measures
# workloads of 1,000, 2,000, 4,000, and 8,000 images, repeats each size 30 times,
# and fits a law for each resource.
#
# `scale:` sets the model size. At 5,000 x 8,000, this file models 40 million
# images. Scale 1 runs directly; larger scales project the result.
#
# Java code must provide these hooks:
#
#   Job.Load  receives the count and builds images for probe runs.
#   Job.Run   receives the data and follows the same path in probe and full runs.
#   units(n)  in Shrinker reports each call's input size.
#
# ../README.md explains this output under `4-scaled.yaml`, including the time
# error bar and invariant failures.
seed: 1
scale: 5000

nodes:
  master:
    instance: m5.large
    zone: eu-central-1a
    runs: { dissaly.Job: src/thumbs/ThumbJob.java }

  w:
    count: 4
    prefix: w
    instance: c5.large
    zone: [eu-central-1a, eu-central-1a, eu-central-1b, eu-central-1b]
    runs: { Shrinker: src/thumbs/Shrinker.java }

    # The largest workload includes a failure measurement. A model built only
    # from successful runs under-predicts this case.
    overrides:
      w1:
        failures:
          - { kill: true, at: 400 refMs }

network:
  sameZone: 0.2 refMs
  crossZone: 0.8 refMs
  jitter: 0.1 refMs

# Full workload. A probe uses count * units / (scale * 8000). The probe range is
# 1,000 to 8,000 images.
#
# Without `source:`, Job.Load generates images from the seed. The workload is
# reproducible across a sweep. Load is outside the measured interval.
input:
  unit:  image
  count: 40000000

simulatedDuration:
  src/thumbs/Shrinker.java:
    Thumbnail: { fixed: 0.4 refMs, perUnit: 55000 refNs }
    Collect:   { fixed: 1 refMs }
